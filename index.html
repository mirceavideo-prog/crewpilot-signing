<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrewPilot — Review & Sign</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#163241;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:870px;margin:22px auto;padding:16px}.panel{background:white;border:1px solid #d8e4e6;border-radius:14px;padding:22px;margin:0 0 20px}header{background:#163241;color:white;padding:22px;border-radius:13px;margin-bottom:20px;border-bottom:6px solid #219c81}h1{font-size:24px;margin:4px 0}h2{font-size:19px}.small{font-size:14px;color:#526878}iframe{border:1px solid #cbdadd;width:100%;height:65vh;border-radius:8px;background:white}label{display:block;margin:17px 0 8px}input[type=text]{width:100%;padding:12px;border-radius:8px;border:1px solid #9aacb5;font:inherit}canvas{display:block;width:100%;height:180px;border:2px solid #9abfb8;border-radius:8px;background:#fff;touch-action:none}button{cursor:pointer;padding:12px 18px;border:0;border-radius:8px;background:#219c81;color:#fff;font:600 15px system-ui}button.secondary{background:#e7eff1;color:#173746}button:disabled{opacity:.5}#status{margin-top:14px;font-weight:600}a{color:#137a68}
</style></head><body><main><header><strong>CREWPILOT</strong><h1>Review & Sign Your Quote</h1><div>No CrewPilot account required</div></header>
<section class="panel"><h2>Your quote, contract and warranty</h2><p class="small">Read the complete PDF before signing. This invitation expires after seven days.</p><div id="loading">Loading your quote securely…</div><iframe id="document" title="Customer quote PDF" hidden></iframe><p><a id="openpdf" target="_blank" rel="noopener noreferrer" hidden>Open the PDF in another tab</a></p></section>
<section id="signing" class="panel" hidden><h2>Customer signature</h2><label for="name">Full legal name</label><input id="name" type="text" autocomplete="name" maxlength="120"><label>Draw your signature with your finger, mouse or stylus</label><canvas id="sig" width="900" height="260"></canvas><p><button id="clear" type="button" class="secondary">Clear signature</button></p><label><input id="consent" type="checkbox"> I have reviewed the quote, pricing, contract terms and written warranty, and I agree to sign electronically.</label><button id="submit" type="button">Sign & Submit</button><p id="status" role="status"></p></section></main>
<script>
const API='https://mpsthqztsdoehvzwlnmx.supabase.co/functions/v1/review-sign',token=new URLSearchParams(location.search).get('token');
const status=document.getElementById('status'),loading=document.getElementById('loading');
const cv=document.getElementById('sig'),ctx=cv.getContext('2d');ctx.strokeStyle='#173241';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';let active=false,drawn=false;
function pointer(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
cv.addEventListener('pointerdown',e=>{active=true;drawn=true;cv.setPointerCapture(e.pointerId);const p=pointer(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});
cv.addEventListener('pointermove',e=>{if(!active)return;const p=pointer(e);ctx.lineTo(p.x,p.y);ctx.stroke()});cv.addEventListener('pointerup',()=>active=false);cv.addEventListener('pointercancel',()=>active=false);
document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);drawn=false};
async function load(){if(!token||!/^[a-f0-9]{64}$/.test(token)){loading.textContent='Open the private Review & Sign link from your email.';return}
try{const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Quote unavailable');
document.getElementById('document').src=x.pdfUrl;document.getElementById('document').hidden=false;document.getElementById('openpdf').href=x.pdfUrl;document.getElementById('openpdf').hidden=false;document.getElementById('signing').hidden=false;loading.hidden=true}catch(e){loading.textContent=e.message}}
document.getElementById('submit').onclick=async()=>{const name=document.getElementById('name').value.trim(),btn=document.getElementById('submit');if(name.length<2||!drawn||!document.getElementById('consent').checked){status.textContent='Please enter your name, draw your signature and check the agreement.';return}
btn.disabled=true;status.textContent='Saving your signature securely…';
try{const response=await fetch(API+'?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,name,signature:cv.toDataURL('image/png'),consent:true})}),result=await response.json();if(!response.ok)throw Error(result.error||'Signing failed');status.textContent='Signed successfully. Your contractor has a signed record.';btn.textContent='Signed'}catch(e){status.textContent=e.message;btn.disabled=false}};load();
</script></body></html>
